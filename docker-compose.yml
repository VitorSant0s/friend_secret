name: amigo-secreto

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # As credenciais do WhatsApp precisam sobreviver a reinícios e atualizações
      - sessions:/app/.whatsapp-sessions
    expose:
      - "3000"

  nginx:
    build: ./nginx
    restart: on-failure:3
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt

volumes:
  sessions:
  letsencrypt:

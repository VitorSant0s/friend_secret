name: amigo-secreto

services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # As credenciais do WhatsApp precisam sobreviver a reinícios e atualizações
      - sessions:/app/.whatsapp-sessions
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  sessions:
  caddy_data:
  caddy_config:
